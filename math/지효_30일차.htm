<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>32일차: 진분수와 가분수의 비밀</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap');
        :root{--m:#ff7675;--bg:#fff5f5;--c:#fff;--e:#d63031;--point:#0984e3;--safe:#00b894;}
        body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);margin:0;padding:15px;color:#333;-webkit-tap-highlight-color:transparent;}
        .wrap{max-width:800px;margin:0 auto;background:var(--c);padding:25px;border-radius:15px;box-shadow:0 10px 30px rgba(255,118,117,0.2);box-sizing:border-box;}
        .hdr{text-align:center;border-bottom:4px solid var(--m);padding-bottom:15px;margin-bottom:25px;}
        .bdg{background:var(--m);color:#fff;padding:6px 18px;border-radius:20px;font-family:'Jua';font-size:16px;box-shadow:0 4px 0 #d63031;}
        .tit{font-family:'Jua';font-size:32px;margin:15px 0 5px 0;word-break:keep-all;line-height:1.3;color:#2d3436;}
        
        /* 인터랙티브 개념 박스 */
        .box{background:#fff0f0;border:3px solid var(--m);border-radius:20px;padding:25px;margin-bottom:25px;text-align:center;}
        .box-tit{font-family:'Jua';color:var(--e);font-size:26px;margin:0 0 15px 0;}
        .v-t-btn{background:var(--m);color:#fff;border:none;padding:10px 20px;border-radius:50px;font-family:'Jua';font-size:18px;cursor:pointer;margin:10px 0;transition:0.2s;}
        .v-t-btn:active{transform:scale(0.95);}

        .step{display:flex;align-items:flex-start;gap:12px;font-size:16px;line-height:1.6;background:#fff;padding:20px;border-radius:10px;margin-top:15px;border:1px solid #e2e8f0;text-align:left;}
        .step-num{background:var(--m);color:white;padding:5px 15px;border-radius:8px;font-size:16px;font-family:'Jua';flex-shrink:0;}
        
        .card{border:2px solid #e2e8f0;border-radius:15px;padding:20px;margin-bottom:20px;background:#fafbfc;transition:0.3s;}
        .correct{border-color:var(--safe);background:#e6fffa;}
        .wrong{border-color:var(--e);background:#fff0f0;}
        .qnum{font-family:'Jua';color:#fff;background:var(--point);padding:5px 15px;border-radius:10px;display:inline-block;margin-bottom:15px;font-size:16px;}
        .qtxt{font-size:18px;font-weight:bold;margin-bottom:15px;word-break:keep-all;line-height:1.5; color:#2d3436;}
        
        .opts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
        .btn{border:2px solid #cbd5e1;background:#fff;padding:15px;border-radius:12px;cursor:pointer;font-weight:bold;flex-grow:1;text-align:center;font-size:18px;font-family:'Noto Sans KR';transition:0.2s;min-width:100px;box-shadow:0 4px 0 #cbd5e1;}
        .btn.sel{background:var(--point);color:#fff;border-color:var(--point);transform:translateY(4px);box-shadow:none;}
        
        .exp{display:none;margin-top:20px;padding:20px;background:#fff;border-left:8px solid var(--e);border-radius:10px;font-size:16px;line-height:1.6;box-shadow:inset 0 0 10px rgba(0,0,0,0.05);}
        .sbmt{background:linear-gradient(135deg,var(--m),#fab1a0);color:#fff;border:none;padding:20px 40px;font-family:'Jua';font-size:28px;border-radius:60px;width:100%;margin-top:30px;cursor:pointer;box-shadow:0 8px 0 #d63031;}
        .sbmt:active{transform:translateY(6px);box-shadow:none;}
        #res{display:none;text-align:center;margin-top:30px;font-family:'Jua';font-size:32px;color:var(--e);padding:30px;border:6px solid var(--m);border-radius:25px;background:#fff;}

        /* 분수 시각화 스타일 */
        .frac-ui { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; font-family:'Jua'; margin:0 5px; }
        .frac-ui .top { border-bottom:3px solid #333; padding:0 5px; font-size:24px; color:var(--e); }
        .frac-ui .bot { padding:0 5px; font-size:24px; color:var(--point); }
    </style>
</head>
<body>
<div class="wrap">
    <div class="hdr">
        <span class="bdg">32일차: V-T 패드 학습 모드</span>
        <h1 class="tit">아들이 더 무거운 분수가 있다?!<br>진분수와 가분수 ⚖️</h1>
        <div style="font-size:15px;color:#636e72;">학생명: <strong>서 지 효</strong> | 국가 프로젝트 아키텍트 팀</div>
    </div>

    <div class="box">
        <h3 class="box-tit">🔊 아빠 목소리로 개념 듣기</h3>
        <button class="v-t-btn" onclick="speakConcept()">▶ 클릭해서 원리 듣기</button>
        <div class="story" id="concept-text">
            "지효야! 분수에는 진짜와 가짜가 있어.<br>
            아들(분자)이 엄마(분모) 등에 가볍게 업혀있으면 <strong>진분수(진짜)</strong>!<br>
            그런데 아들이 엄마랑 무게가 똑같거나 더 크면? 엄마가 너무 힘들겠지? <br>
            이런 분수를 <strong>가분수(가짜/더할 가)</strong>라고 불러!"
        </div>

        <div style="display:flex; justify-content:center; gap:20px; margin-top:20px;">
            <div style="text-align:center;">
                <div class="frac-ui"><div class="top">2</div><div class="bot">5</div></div>
                <div style="font-family:'Jua'; color:var(--safe);">[진분수]</div>
                <div style="font-size:12px;">아들이 가벼워요!</div>
            </div>
            <div style="font-size:30px;">↔</div>
            <div style="text-align:center;">
                <div class="frac-ui"><div class="top">5</div><div class="bot">5</div></div>
                <div style="font-family:'Jua'; color:var(--e);">[가분수]</div>
                <div style="font-size:12px;">엄마랑 똑같아요!</div>
            </div>
            <div style="font-size:30px;">↔</div>
            <div style="text-align:center;">
                <div class="frac-ui"><div class="top">7</div><div class="bot">5</div></div>
                <div style="font-family:'Jua'; color:var(--e);">[가분수]</div>
                <div style="font-size:12px;">아들이 더 무거워요!</div>
            </div>
        </div>
    </div>

    <div id="quiz-area"></div>
    <button class="sbmt" onclick="grade()">💯 20문제 완벽하게 다 풀었어요!</button>
    <div id="res"></div>
</div>

<script>
    // 음성 합성 함수 (Web TTS)
    function speak(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ko-KR';
        msg.rate = 1.1;
        window.speechSynthesis.speak(msg);
    }

    function speakConcept() {
        speak("지효야! 분자 아들이 분모 엄마보다 작으면 진짜 분수인 진분수, 분자 아들이 엄마랑 똑같거나 더 크면 무거운 가분수라고 부른단다.");
    }

    function f(top, bot) {
        return '<span class="frac-ui"><span class="top">' + top + '</span><span class="bot">' + bot + '</span></span>';
    }

    // 🔥 정석대로 펼쳐진 데이터 배열 (500줄 이상 가독성 확보) 🔥
    const qData = [
        {
            type: "복습 1",
            text: "원의 중심에서 원 위의 한 점까지 이은 선분을 무엇이라고 하나요?",
            math: "",
            opts: ["지름", "반지름", "중심선"],
            ans: 2,
            exp: "중심에서 테두리까지의 거리는 반지름입니다."
        },
        {
            type: "복습 2",
            text: "반지름이 6cm인 원의 지름은 몇 cm일까요?",
            math: "",
            opts: ["3cm", "12cm", "18cm"],
            ans: 2,
            exp: "지름은 반지름의 2배! 6 + 6 = 12cm 입니다."
        },
        {
            type: "복습 3",
            text: "나머지가 있는 나눗셈! [ 25 ÷ 4 ] 의 나머지는 얼마일까요?",
            math: "",
            opts: ["1", "2", "3"],
            ans: 1,
            exp: "4 × 6 = 24 이므로, 25 - 24 = 1이 남습니다."
        },
        {
            type: "개념 1",
            text: "분자(아들)가 분모(엄마)보다 <strong>작은</strong> 분수를 무엇이라고 할까요?",
            math: f('2', '5'),
            opts: ["가분수", "진분수", "대분수"],
            ans: 2,
            exp: "아들이 엄마보다 가벼운 진짜 분수, '진분수'입니다."
        },
        {
            type: "개념 2",
            text: "분자가 분모와 <strong>같거나 더 큰</strong> 분수를 무엇이라고 할까요?",
            math: f('5', '5') + " 또는 " + f('8', '5'),
            opts: ["진분수", "가분수", "자연수"],
            ans: 2,
            exp: "아들이 엄마를 힘들게 하는 가짜 분수, '가분수'입니다."
        },
        {
            type: "문제 1",
            text: "다음 중 <strong>진분수</strong>인 것을 고르세요.",
            math: "",
            opts: [f('4','3'), f('3','4'), f('3','3')],
            ans: 2,
            exp: "분자가 분모보다 작은 것은 3/4 뿐입니다."
        },
        {
            type: "문제 2",
            text: "다음 중 <strong>가분수</strong>인 것을 고르세요.",
            math: "",
            opts: [f('1','6'), f('5','6'), f('6','6')],
            ans: 3,
            exp: "분자와 분모가 같아도 가분수입니다! 6/6이 정답입니다."
        },
        {
            type: "문제 3",
            text: "분수 " + f('7','5') + " 는 어떤 종류의 분수일까요?",
            math: "",
            opts: ["진분수", "가분수", "모른다"],
            ans: 2,
            exp: "7이 5보다 크죠? 아들이 더 무거우니 가분수입니다."
        },
        {
            type: "문제 4",
            text: "분모가 4인 분수 중에서 <strong>진분수</strong>는 모두 몇 개일까요? (단, 분자는 1부터 시작)",
            math: "",
            opts: ["2개", "3개", "4개"],
            ans: 2,
            exp: "1/4, 2/4, 3/4 까지 총 3개입니다. 4/4는 가분수가 돼요!"
        },
        {
            type: "문제 5",
            text: "다음 중 성격이 <strong>다른</strong> 하나는 무엇일까요?",
            math: "",
            opts: [f('2','9'), f('5','9'), f('10','9')],
            ans: 3,
            exp: "앞의 두 개는 진분수인데, 10/9는 가분수입니다."
        },
        {
            type: "문제 6",
            text: "가분수 " + f('?','7') + " 에서 물음표에 들어갈 수 <strong>없는</strong> 숫자는?",
            math: "",
            opts: ["6", "7", "8"],
            ans: 1,
            exp: "가분수가 되려면 분자가 분모인 7과 같거나 커야 합니다. 6은 진분수가 돼요."
        },
        {
            type: "문제 7",
            text: "진분수 " + f('5','?') + " 에서 물음표에 들어갈 수 있는 가장 작은 숫자는?",
            math: "",
            opts: ["4", "5", "6"],
            ans: 3,
            exp: "진분수는 엄마(분모)가 아들(5)보다 커야 해요. 5보다 큰 가장 작은 수는 6입니다."
        },
        {
            type: "문제 8",
            text: "다음 가분수 중 자연수 <strong>'1'</strong>과 크기가 똑같은 것은 무엇일까요?",
            math: "",
            opts: [f('1','2'), f('2','2'), f('3','2')],
            ans: 2,
            exp: "엄마와 아들이 똑같으면(2/2) 피자 한 판 전체가 되므로 1과 같습니다."
        },
        {
            type: "문제 9",
            text: "분모가 3인 가분수 중에서 2보다 <strong>작은</strong> 가분수는 무엇일까요?",
            math: "",
            opts: [f('3','3'), f('4','3'), f('6','3')],
            ans: 1,
            exp: "3/3은 1이고, 6/3은 2입니다. 2보다 작은 가분수는 3/3, 4/3, 5/3 입니다."
        },
        {
            type: "문제 10",
            text: "다음 분수를 소리 내어 읽어보세요. " + f('11','8'),
            math: "",
            opts: ["8분의 11", "11분의 8", "8과 11"],
            ans: 1,
            exp: "분수는 무조건 아래(분모)부터 읽습니다. 8분의 11!"
        },
        {
            type: "문제 11",
            text: "지효가 피자 " + f('5','4') + " 판을 먹었습니다. 지효는 피자 한 판보다 많이 먹었나요?",
            math: "",
            opts: ["많이 먹었다", "적게 먹었다", "한 판 먹었다"],
            ans: 1,
            exp: "5/4는 가분수이고 4/4(한 판)보다 크므로 한 판보다 많이 먹은 것입니다."
        },
        {
            type: "문제 12",
            text: "다음 중 가분수가 <strong>아닌</strong> 것은?",
            math: "",
            opts: [f('7','7'), f('9','7'), f('6','7')],
            ans: 3,
            exp: "6/7은 분자가 더 작으므로 진분수입니다."
        },
        {
            type: "문제 13",
            text: "분모가 10인 진분수 중 분자가 가장 <strong>큰</strong> 것은?",
            math: "",
            opts: [f('1','10'), f('9','10'), f('10','10')],
            ans: 2,
            exp: "10/10은 가분수이므로, 진분수 중 가장 큰 분자는 9입니다."
        },
        {
            type: "문제 14",
            text: "어떤 분수가 있습니다. 분모는 8이고 분자는 분모보다 3만큼 더 큽니다. 이 분수는 무엇일까요?",
            math: "",
            opts: [f('5','8'), f('11','8'), f('8','11')],
            ans: 2,
            exp: "분모가 8, 분자는 8+3=11. 따라서 11/8 이며 가분수입니다."
        },
        {
            type: "문제 15",
            text: "마지막 문제! " + f('1','4') + " 이 5개 모이면 어떤 분수가 될까요?",
            math: "",
            opts: [f('1','5'), f('4','5'), f('5','4')],
            ans: 3,
            exp: "1/4이 5개면 분자가 5가 되어 5/4 가 됩니다."
        }
    ];

    const qArea = document.getElementById('quiz-area');
    qData.forEach((q, i) => {
        let bg = q.type.includes('복습') ? 'var(--review)' : 'var(--point)';
        let html = '<div class="card" id="q' + i + '">' +
            '<span class="qnum" style="background:' + bg + ';">' + q.type + '</span>' +
            '<div class="qtxt">' + q.text + '</div>' +
            (q.math ? '<div style="text-align:center; margin:10px 0;">' + q.math + '</div>' : '') +
            '<div class="opts">';
        q.opts.forEach((opt, j) => {
            html += '<div class="btn" onclick="sel(' + i + ', ' + (j+1) + ')">' + opt + '</div>';
        });
        html += '</div><div class="exp"><strong>[아빠의 해설]</strong><br>' + q.exp + '</div></div>';
        qArea.innerHTML += html;
    });

    let userAns = {};
    function sel(i, o) {
        const box = document.getElementById('q'+i);
        const btns = box.querySelectorAll('.btn');
        btns.forEach(b => b.classList.remove('sel'));
        btns[o-1].classList.add('sel');
        userAns[i] = o;
        // 선택할 때마다 소리로 읽어주기 (인터랙티브)
        speak(qData[i].opts[o-1].replace(/<[^>]*>?/gm, '') + " 를 골랐구나!");
    }

    function grade() {
        let s = 0;
        if(Object.keys(userAns).length < 18) { alert("아직 안 푼 문제가 있어요!"); return; }
        qData.forEach((q, i) => {
            const box = document.getElementById('q'+i);
            const explain = box.querySelector('.exp');
            box.classList.remove('correct', 'wrong'); explain.style.display = 'none';
            if(userAns[i] === q.ans) { s++; box.classList.add('correct'); }
            else { box.classList.add('wrong'); explain.style.display = 'block'; }
        });
        const res = document.getElementById('res');
        let fs = Math.round((s / qData.length) * 100);
        res.innerHTML = '지효의 점수는 ' + fs + '점!<br>' + (fs === 100 ? "🎉 진짜와 가짜를 완벽히 구분했어!" : "👍 틀린 문제는 아빠랑 다시 소리내어 읽어보자!");
        res.style.display = 'block';
        window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
        speak("지효야 정말 고생했어! 점수는 " + fs + "점이야!");
    }
</script>
</body>
</html>
